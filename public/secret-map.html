<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tajná Mapa</title>
  <style>
    body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
    #map { width: 100%; height: 100vh; }
    
    .pulse-marker {
      width: 40px;
      height: 40px;
      background: rgba(197, 160, 89, 0.4); /* mafia-gold s průhledností */
      border: 2px solid rgba(197, 160, 89, 0.8);
      border-radius: 50%;
      animation: pulse 2s infinite ease-out;
      pointer-events: none;
    }
    
    @keyframes pulse {
      0% { transform: scale(0.3); opacity: 1; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #c5a059; font-family: sans-serif; z-index: 100;
    }
  </style>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>
  <div id="loading">Načítání mapy úkrytů...</div>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/dark',
        center: [17.4835088, 49.0592272],
        zoom: 12 // Odzoomováno pro zobrazení více oblastí
      });

      map.on('load', function() {
        document.getElementById('loading').style.display = 'none';
      });

      // Seznam lokací, kde budou pulzující kruhy
      var locations = [
        [17.4835088, 49.0592272], // Uherský Brod
        [17.465, 49.068], // Havřice
        [17.512, 49.041], // Nivnice
        [17.530, 49.080], // Bánov
        [17.420, 49.030]  // Vlčnov
      ];

      locations.forEach(function(coord) {
        var el = document.createElement('div');
        el.className = 'pulse-marker';
        
        new maplibregl.Marker({ element: el })
          .setLngLat(coord)
          .addTo(map);
      });
    });
  </script>
</body>
</html>
